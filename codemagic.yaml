# Codemagic builds of the Parla app. Builds start by hand in Codemagic
# (no automatic trigger), so build minutes are only spent when wanted.
#
# One-time setup in the Codemagic UI (see docs/RELEASE.md):
# - Team settings → Code signing identities → Android keystores:
#   upload keystore with reference name "parla_upload".
# - Team settings → Integrations → Developer Portal: App Store Connect API
#   key named "Parla ASC".
# - Environment variable groups:
#   - "parla_staging": SERVER_URL (e.g. https://parla-staging-xxxx.run.app/)
#   - "google_play": GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (secure)
# No secret is ever written in this file.

definitions:
  flutter: &flutter 3.47.9
  instance: &instance mac_mini_m2
  get_packages: &get_packages
    name: Get packages
    script: |
      cd parla_flutter
      flutter pub get
  tests: &tests
    name: Flutter tests
    script: |
      cd parla_flutter
      flutter analyze
      flutter test

workflows:
  android-internal:
    name: Android → Play internal testing
    instance_type: *instance
    max_build_duration: 60
    environment:
      flutter: *flutter
      android_signing:
        - parla_upload
      groups:
        - parla_staging
        - google_play
      vars:
        PACKAGE_NAME: com.atlasoon.parla
    scripts:
      - *get_packages
      - *tests
      - name: Build Android App Bundle
        script: |
          cd parla_flutter
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SERVER_URL="$SERVER_URL"
    artifacts:
      - parla_flutter/build/**/outputs/**/*.aab
      - parla_flutter/build/**/outputs/**/mapping.txt
    publishing:
      # The very first bundle must be uploaded by hand in Play Console
      # (download it from this build's artifacts). Later builds go to the
      # internal testing track as drafts.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-testflight:
    name: iOS → TestFlight
    instance_type: *instance
    max_build_duration: 60
    integrations:
      app_store_connect: Parla ASC
    environment:
      flutter: *flutter
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.atlasoon.parla
      groups:
        - parla_staging
    scripts:
      - *get_packages
      - *tests
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Install pods
        script: |
          cd parla_flutter/ios
          pod install
      - name: Build IPA
        script: |
          cd parla_flutter
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SERVER_URL="$SERVER_URL" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - parla_flutter/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers get the build after Apple's processing; no beta
        # review is needed for them.
        submit_to_testflight: false
