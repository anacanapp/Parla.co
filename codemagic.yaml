# Codemagic builds of the Parla app. Builds start by hand in Codemagic
# (no automatic trigger), so build minutes are only spent when wanted.
#
# One-time setup in the Codemagic UI (see docs/RELEASE.md):
# - Team settings → Code signing identities → Android keystores:
#   upload keystore with reference name "parla_upload".
# - Environment variable groups:
#   - "parla_staging": SERVER_URL (the server_url output of
#     deploy/aws/staging, e.g. https://xxxx.cloudfront.net/)
#   - "google_play": GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (secure)
#   - "app_store": APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
#     APP_STORE_CONNECT_PRIVATE_KEY (secure), CERTIFICATE_PRIVATE_KEY (secure)
# No secret is ever written in this file.

definitions:
  flutter: &flutter 3.47.9
  instance: &instance mac_mini_m2
  get_packages: &get_packages
    name: Get packages
    script: |
      cd parla_flutter
      flutter pub get
  tests: &tests
    name: Flutter tests
    script: |
      cd parla_flutter
      flutter analyze
      flutter test

workflows:
  # A signed APK that testers install straight from the build's artifacts,
  # without Google Play. Uses the same upload key as the Play builds.
  android-apk:
    name: Android → test APK (direct install)
    instance_type: *instance
    max_build_duration: 60
    environment:
      flutter: *flutter
      android_signing:
        - parla_upload
      groups:
        - parla_staging
    scripts:
      - *get_packages
      - *tests
      - name: Build Android APK
        script: |
          cd parla_flutter
          flutter build apk --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SERVER_URL="$SERVER_URL"
    artifacts:
      - parla_flutter/build/app/outputs/flutter-apk/*.apk
      - parla_flutter/build/**/outputs/**/mapping.txt

  android-internal:
    name: Android → Play internal testing
    instance_type: *instance
    max_build_duration: 60
    environment:
      flutter: *flutter
      android_signing:
        - parla_upload
      groups:
        - parla_staging
        - google_play
      vars:
        PACKAGE_NAME: com.atlasoon.parla
    scripts:
      - *get_packages
      - *tests
      - name: Build Android App Bundle
        script: |
          cd parla_flutter
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SERVER_URL="$SERVER_URL"
    artifacts:
      - parla_flutter/build/**/outputs/**/*.aab
      - parla_flutter/build/**/outputs/**/mapping.txt
    publishing:
      # The very first bundle must be uploaded by hand in Play Console
      # (download it from this build's artifacts). Later builds go to the
      # internal testing track as drafts.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  # Signing without Codemagic's UI integrations, so it also works on a
  # personal Codemagic account: the Codemagic CLI tools fetch (or create once)
  # the Apple Distribution certificate and the App Store profile with the App
  # Store Connect API key from the "app_store" group.
  ios-testflight:
    name: iOS → TestFlight
    instance_type: *instance
    max_build_duration: 60
    environment:
      flutter: *flutter
      xcode: latest
      cocoapods: default
      groups:
        - parla_staging
        # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
        # APP_STORE_CONNECT_PRIVATE_KEY (secure), CERTIFICATE_PRIVATE_KEY
        # (secure). Read by the CLI tools below and by publishing.
        - app_store
      vars:
        BUNDLE_ID: com.atlasoon.parla
    scripts:
      - *get_packages
      - *tests
      - name: Set up code signing
        script: |
          keychain initialize
          # Reuses the distribution certificate that matches
          # CERTIFICATE_PRIVATE_KEY and the App Store profile; creates them
          # only when they do not exist yet.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      # No separate "pod install": the iOS project uses Flutter's Swift
      # Package Manager integration, and `flutter build ipa` sets up
      # CocoaPods by itself if a plugin still needs it.
      - name: Build IPA
        script: |
          cd parla_flutter
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SERVER_URL="$SERVER_URL" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - parla_flutter/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Internal testers get the build after Apple's processing; no beta
        # review is needed for them.
        submit_to_testflight: false

  # Uploads the App Store texts and screenshots from
  # parla_flutter/ios/fastlane (Deliverfile there) to the version being
  # prepared in App Store Connect. Builds nothing and never submits for
  # review. Uses the same "app_store" API key group as ios-testflight.
  ios-store-listing:
    name: iOS → App Store listing
    instance_type: *instance
    max_build_duration: 30
    environment:
      groups:
        - app_store
    scripts:
      - name: Write the API key file for fastlane
        script: |
          # Written to the build machine only for this build; never printed.
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["CM_BUILD_DIR"], "asc_api_key.json")
          with open(path, "w") as f:
              json.dump({
                  "key_id": os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"],
                  "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
                  "key": os.environ["APP_STORE_CONNECT_PRIVATE_KEY"],
                  "in_house": False,
              }, f)
          os.chmod(path, 0o600)
          PY
      - name: Upload texts and screenshots
        script: |
          cd parla_flutter/ios
          fastlane deliver --api_key_path "$CM_BUILD_DIR/asc_api_key.json"
      - name: Remove the API key file
        script: rm -f "$CM_BUILD_DIR/asc_api_key.json"
