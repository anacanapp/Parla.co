name: parla
description: Parla, a personal beauty and care guide.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.5
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.1
  flutter_localizations:
    sdk: flutter
  # Habit entries are kept on the device only, in the Keychain or with an
  # Android Keystore key.
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.3.4
  flutter_timezone: ^5.1.1
  go_router: ^18.1.4
  intl: any
  parla_client:
    path: ../parla_client
  parla_shared:
    path: ../parla_shared
  serverpod_auth_idp_flutter: 4.1.1
  serverpod_flutter: 4.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  # Calls and WhatsApp to listed experts open the phone's own apps.
  url_launcher: ^6.3.1
  video_player: ^2.11.1
  wakelock_plus: ^1.3.0

dev_dependencies:
  # Used for agents to drive the app through the Dart MCP
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

dependency_overrides:
  flutter_secure_storage: ^10.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  assets:
    - assets/config.json

  # Brand fonts, bundled so no font is fetched from Google at runtime
  # (that would send the user's IP address to a third party).
  # Licences: assets/fonts/OFL-*.txt (SIL Open Font License 1.1).
  fonts:
    # Plus Jakarta Sans has no Cyrillic: Russian text falls back to Onest
    # (theme fontFamilyFallback), which covers Cyrillic and Azerbaijani.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Onest is the interface face of the night design (2026-11-23): it
    # covers Latin, Azerbaijani and Cyrillic, with light weights for large
    # numbers and greetings.
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Onest-Light.ttf
          weight: 300
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
        - asset: assets/fonts/Onest-ExtraBold.ttf
          weight: 800
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-MediumItalic.ttf
          style: italic
          weight: 500

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

# App icon from the brand guidelines v2.0 (07 · App ikon): the Smile mark on
# Sun. Regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFCE00"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFCE00"
    theme_color: "#FFCE00"
