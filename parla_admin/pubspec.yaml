name: parla_admin
description: "Parla admin panel (web). Staff only: content, users, statistics."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.4
  intl: any
  parla_client:
    path: ../parla_client
  parla_shared:
    path: ../parla_shared
  serverpod_auth_idp_flutter: 4.1.1
  serverpod_flutter: 4.1.1
  file_picker: ^13.4.0
  image: ^4.13.1
  flutter_markdown_plus: ^1.0.12
  html: ^0.15.7
  web: ^1.1.2
  pdf: ^3.13.1

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # The Parla brand fonts, bundled so the browser loads nothing from Google
  # (SIL OFL 1.1, licences next to the files). Plus Jakarta Sans has no
  # Cyrillic: Russian text falls back to Onest (theme fontFamilyFallback).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
        - asset: assets/fonts/Onest-ExtraBold.ttf
          weight: 800
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-MediumItalic.ttf
          style: italic
          weight: 500
