# Gitleaks configuration (checklist ENC-4).
# Keeps all default rules. The only exception is pubspec.lock: pub writes it
# and it holds nothing but package names, versions, pub.dev URLs and public
# 64-character sha256 content hashes, which can match token patterns by
# chance (the 'hooks' package hash starts with "eaac", like a Facebook token).
title = "Parla gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "pub lockfile: public package hashes only"
paths = ['''(^|/)pubspec\.lock$''']
