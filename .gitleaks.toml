# Gitleaks configuration (checklist ENC-4).
# Keeps all default rules and only allows lines that are nothing but a
# pub package content hash, e.g. `sha256: eaac...` in pubspec.lock. Such a
# hash is public, 64 hex characters, and can match token patterns by chance.
title = "Parla gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "pub.dev package content hashes"
regexTarget = "line"
regexes = ['''^\s*sha256: "?[0-9a-f]{64}"?\s*$''']
