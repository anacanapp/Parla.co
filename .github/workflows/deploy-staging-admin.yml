name: Deploy staging admin panel

# Started by hand (Actions -> Deploy staging admin panel -> Run workflow).
# Builds parla_admin for the staging server and uploads it to the private
# S3 bucket behind the admin CloudFront address. Same OIDC role as the
# server deploy; no AWS key is stored in GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging-admin
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  FLUTTER_VERSION: '3.47.9'

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Build the panel
        working-directory: parla_admin
        env:
          SERVER_URL: ${{ vars.STAGING_SERVER_URL }}
        run: |
          test -n "$SERVER_URL" || { echo "Set the STAGING_SERVER_URL variable"; exit 1; }
          flutter pub get
          # CanvasKit is bundled (no Google CDN), so the browser loads
          # nothing from third parties.
          flutter build web --release --no-web-resources-cdn \
            --dart-define=SERVER_URL="$SERVER_URL"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload and refresh the cache
        env:
          BUCKET: ${{ vars.ADMIN_BUCKET }}
          DISTRIBUTION: ${{ vars.ADMIN_DISTRIBUTION_ID }}
        run: |
          test -n "$BUCKET" && test -n "$DISTRIBUTION" || {
            echo "Set the ADMIN_BUCKET and ADMIN_DISTRIBUTION_ID variables"; exit 1; }
          aws s3 sync parla_admin/build/web "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths '/*' >/dev/null
