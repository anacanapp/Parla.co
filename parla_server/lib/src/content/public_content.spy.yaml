### A published content item as the app reads it.
class: PublicContent
fields:
  id: int
  kind: String
  slug: String
  category: String
  json: String
  reviewedAt: DateTime?
  publishedAt: DateTime
  ### The item's image, when it has a published one.
  image: PublicImage?
  ### Catalogue items the app must not show.
  hidden: bool
